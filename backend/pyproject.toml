[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eternal"
version = "0.1.0"
description = "AI-assisted lending and trading platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Developer", email = "dev@example.com"},
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "pydantic>=2.0.0",
    "sqlalchemy (>=2.0.50,<3.0.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "click (>=8.4.1,<9.0.0)",
    "dependency-injector (>=4.49.0,<5.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[project.scripts]
lending-cli = "app.cli:cli"

[tool.poetry]
packages = [{ include = "app" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]