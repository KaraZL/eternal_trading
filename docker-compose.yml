services:
  postgres:
    image: postgres:16
    container_name: ai_lending_postgres
    environment:
      POSTGRES_USER: lending_user
      POSTGRES_PASSWORD: lending_password
      POSTGRES_DB: lending_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: